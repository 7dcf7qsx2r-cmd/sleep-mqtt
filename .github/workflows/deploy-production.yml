name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '119.29.148.43' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      REMOTE_DIR: ${{ vars.REMOTE_DIR || '/root/sleep-mqtt' }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://119.29.148.43:8790/health' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Render .env
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
          SEED_DEVICE_SECRET: ${{ secrets.SEED_DEVICE_SECRET }}
          MQTT_PUBLIC_HOST: ${{ vars.MQTT_PUBLIC_HOST || '119.29.148.43' }}
          SEED_PRODUCT_KEY: ${{ vars.SEED_PRODUCT_KEY || 'xiaomian_mvp' }}
          SEED_DEVICE_SN: ${{ vars.SEED_DEVICE_SN || 'SNDEMO0001' }}
        run: |
          chmod +x scripts/ci/render-dotenv.sh
          ./scripts/ci/render-dotenv.sh > .env.deploy

      - name: Upload code and env
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${REMOTE_DIR}'"
          rsync -az --delete \
            --exclude node_modules \
            --exclude data \
            --exclude .env \
            --exclude dist \
            --exclude .git \
            --exclude auth/node_modules \
            -e "ssh -o StrictHostKeyChecking=no -p ${SERVER_PORT}" \
            ./ "${SERVER_USER}@${SERVER_HOST}:${REMOTE_DIR}/"
          scp -P "$SERVER_PORT" -o StrictHostKeyChecking=no .env.deploy "${SERVER_USER}@${SERVER_HOST}:${REMOTE_DIR}/.env"

      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' bash -s" \
            < scripts/ci/deploy-remote.sh

      - name: Health check on server
        run: |
          ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" \
            "curl -sf http://127.0.0.1:8790/health"
